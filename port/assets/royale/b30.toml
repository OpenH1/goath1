end = [-50.00, 120.00, 60.00]
speed = 9.0

[[flight_path]]
start = [55.00, -130.00, 60.00]
end = [55.00, 120.00, 60.00]
speed = 9.0

# the beam's stages: wait delay seconds, then move the front from start to end (fractions of the map's
# length from its side) over duration seconds; damage_per_second behind it
[[beam_stage]]
delay = 90.0
start = 0.00
end = 0.25
duration = 60.0
damage_per_second = 0.03

[[beam_stage]]
delay = 60.0
start = 0.25
end = 0.45
duration = 50.0
damage_per_second = 0.05

[[beam_stage]]
delay = 50.0
start = 0.45
end = 0.60
duration = 40.0
damage_per_second = 0.08

[[beam_stage]]
delay = 40.0
start = 0.60
end = 0.72
duration = 30.0
damage_per_second = 0.12

[[beam_stage]]
delay = 30.0
start = 0.72
end = 0.80
duration = 25.0
damage_per_second = 0.18

[[beam_stage]]
delay = 45.0
start = 0.80
end = 1.00
duration = 60.0
damage_per_second = 0.30

# the gulag: the cove behind the crashed Pelican, north of the north tower, between the tower and the
# outcrop (walled by cliffs on three sides; the blocked box over it keeps everyone else out)
[gulag]
spawn_a = [-26.00, 43.50, 2.70]
facing_a = 0.0000
spawn_b = [-20.00, 43.50, 2.80]
facing_b = 3.1416
bounds_min = [-28.50, 39.50, 1.00]
bounds_max = [-17.50, 47.50, 9.00]

# the interior's entrances, closed: no player passes these boxes (pushed out of the nearest side). The east shaft
# (the Cartographer's, its lens closed) needs none: a player who falls below the bounds' bottom is put back
[[blocked]]
name = "north tower: the door in the passage under the tower"
bounds_min = [-11.00, 26.50, 11.50]
bounds_max = [-1.50, 30.50, 17.50]

[[blocked]]
name = "south facility: the door under the roof on its east platform"
bounds_min = [21.00, -25.50, 8.50]
bounds_max = [29.00, -18.50, 14.50]

[[blocked]]
name = "round platform: the covered walkway down to its center"
bounds_min = [25.80, 7.00, 12.00]
bounds_max = [29.20, 26.00, 26.00]

[[blocked]]
name = "gulag cove (only the gulag's fighters)"
bounds_min = [-28.50, 39.50, 1.00]
bounds_max = [-17.50, 47.50, 9.00]

